  "shapes": [
    "living",
    "accumulating",
    "transient"
  ],
  "contracts": [
    {
      "name": "product delivery",
      "schema": "product.schema.json",
      "paths": [
        "product/strategy/roadmap/*.md",
        "product/technical/specs/*.md",
        "product/execution/prds/*.md"
      ]
    },
    {
      "name": "technical evidence",
      "schema": "c4.schema.json",
      "paths": [
        "product/technical/architecture/c4/*.json"
      ]
    }
  ],
  "lifecycles": {
    "transient_statuses": {
      "future": [
        "todo",
        "backlog",
        "proposed"
      ],
      "present": [
        "active",
        "in_progress",
        "review",
        "current",
        "running"
      ],
      "past": [
        "done",
        "cancelled",
        "superseded",
        "accepted",
        "rejected",
        "concluded"
      ]
    },
    "terminal_timestamp_fields": [
      "completed_at",
      "cancelled_at",
      "concluded_at",
      "terminal_timestamp"
    ]
  },
  "retention": {
    "tasks_days": 14,
    "plans_days": 30,
    "experiments_days": 30
  },
  "schemas": {
    "living": "living-doc.schema.json",
    "accumulating": "accumulating-record.schema.json",
    "transient": "transient-artifact.schema.json",
    "product_delivery": "product.schema.json",
    "c4": "c4.schema.json"
  }
